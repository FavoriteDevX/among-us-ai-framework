[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "among-us-ai"
version = "0.1.0"
description = "Multi-agent framework for LLM-driven Among Us players on The Skeld"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54", "mss>=9.0", "Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["among_us_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
